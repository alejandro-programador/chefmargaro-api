name: Deploy API

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laravel API por FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Necesario para que FTP-Deploy detecte solo archivos modificados
          fetch-depth: 0

      - name: Preparar solo los archivos pendientes
        run: |
          mkdir -p deploy-api/public deploy-api/routes deploy-api/app/Http/Controllers/Api/V1 deploy-api/app/Services deploy-api/config
          cp api/public/index.php api/public/.htaccess api/public/boot-check.php deploy-api/public/
          cp api/routes/api.php deploy-api/routes/
          cp api/app/Http/Controllers/Api/V1/CheckoutOrderController.php api/app/Http/Controllers/Api/V1/ComboController.php deploy-api/app/Http/Controllers/Api/V1/
          cp api/app/Services/XetuxOrderService.php api/app/Services/XetuxCatalogueService.php deploy-api/app/Services/
          cp api/config/xetux.php deploy-api/config/

      - name: 📁 Sincronizar archivos modificados por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 60000
          local-dir: ./deploy-api/
          # Ruta absoluta desde el home FTP (como en FileZilla)
          server-dir: /domains/chefmargaro.com/public_html/api/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            !**/.env.example
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/phpunit.xml
            **/vite.config.js
            **/package.json
            **/package-lock.json
            **/admin_panel/**
            **/webapp/**
            **/api-bcv/**
            **/.vscode/**
            **/.idea/**
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.phpunit.result.cache
            **/BRANCH_SCOPE.md
