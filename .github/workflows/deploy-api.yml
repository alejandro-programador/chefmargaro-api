name: Deploy API

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laravel API por FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📁 Sincronizar archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: domains/chefmargaro.com/public_html/api/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            !**/.env.example
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/phpunit.xml
            **/vite.config.js
            **/package.json
            **/package-lock.json
            **/admin_panel/**
            **/webapp/**
            **/api-bcv/**
            **/.vscode/**
            **/.idea/**
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.phpunit.result.cache
            **/BRANCH_SCOPE.md

      - name: 📦 Instalar vendor en el servidor (Composer)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd ~/domains/chefmargaro.com/public_html/api
            export COMPOSER_MEMORY_LIMIT=-1
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan optimize:clear || true
