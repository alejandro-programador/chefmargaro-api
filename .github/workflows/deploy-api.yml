name: Deploy API

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Laravel API por SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar rsync y sshpass
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: 📁 Sincronizar archivos por SSH (rsync)
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -e rsync -avz \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='admin_panel/' \
            --exclude='webapp/' \
            --exclude='api-bcv/' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='vite.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='.phpunit.result.cache' \
            --exclude='BRANCH_SCOPE.md' \
            ./ \
            "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:domains/chefmargaro.com/public_html/api/"

      - name: 📦 Instalar vendor en el servidor (Composer)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            cd ~/domains/chefmargaro.com/public_html/api
            export COMPOSER_MEMORY_LIMIT=-1
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan optimize:clear || true
